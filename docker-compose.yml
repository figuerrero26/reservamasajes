services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      # '%' permite que 'root' se conecte desde cualquier host (otros contenedores, la LAN),
      # no solo localhost, que es la restricción por defecto del contenedor oficial.
      MARIADB_ROOT_HOST: '%'
      MARIADB_DATABASE: ${MARIADB_DATABASE:-reservas}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      # El backend se conecta como 'root' de MariaDB (usuario por defecto del contenedor
      # oficial, sin crear un usuario de aplicación aparte). El backend arma la cadena de
      # conexión él mismo a partir de estas variables sueltas (ver backend/app/config.py),
      # codificando correctamente cualquier carácter especial que tenga la contraseña.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      MARIADB_USER: ${MARIADB_USER:-root}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-reservas}
      # Usada también por pytest para crear la BD de pruebas (reservas_test). Debe coincidir
      # con MARIADB_ROOT_PASSWORD del servicio 'db'.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-cambie-esta-clave-en-produccion}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ADMIN_USER: ${ADMIN_USER:-admin_sigra}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-T3cn0z1gr@67!}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    ports:
      - "${BACKEND_PORT:-8001}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
