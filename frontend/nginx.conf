server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend (mismo origen para el navegador).
    location /api/ {
        # El límite por defecto de nginx (1M) rechaza los archivos subidos desde el panel
        # antes de que lleguen al backend (que ya valida sus propios topes por tipo: 5-10 MB
        # para imágenes/GIF, 30 MB para video — ver TIPOS_BIENVENIDA_PERMITIDOS).
        client_max_body_size 35M;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
